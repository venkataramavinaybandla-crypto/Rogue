    This disciplined process reduces guesswork and makes network operations safer, faster and easier to audit.'
  formulas:
  - id: co5-one-change-rollback-verification-formula
    latex: T_restore = T_detect + T_decide + T_change + T_verify
    vars: 'T_restore: restoration time; terms: detection, decision, change and verification durations'
    example: If detection takes 4 min, decision 3 min, change 2 min and verification 5 min, restoration time is
      14 min.
