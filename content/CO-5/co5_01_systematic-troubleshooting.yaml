- id: co5-one-change-rollback-verification
  code: CN-CO5.01.3
  title: One-Change Fixes, Blast Radius, Rollback and Verification
  session: 17
  skilling_exp: 21
  btl: 5
  difficulty: 3
  prereqs:
  - co5-fault-isolation-evidence
  eli5: After identifying a likely cause, make one controlled change, understand who it could affect, and have a
    rollback ready. Then verify that the original service works.
  key_points:
  - A one-change fix makes cause and effect easier to interpret.
  - Blast radius describes the systems, users and services potentially affected.
  - A rollback plan states how to restore the previous known-good state.
  - Verification repeats the original failing test and checks for regressions.
  - A complete incident record includes hypothesis, test, evidence, fix and verification.
  deep_dive: 'One-Change Fixes, Blast Radius, Rollback and Verification belongs to Systematic Troubleshooting in
    CO-5, which focuses on evaluating and operating the network that has already been built. The aim is to turn
