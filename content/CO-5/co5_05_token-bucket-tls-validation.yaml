- id: co5-tls-failure-diagnosis
  code: CN-CO5.05.3
  title: Diagnosing TLS Certificate and Interoperability Failures
  session: 19
  skilling_exp: 22
  btl: 4
  difficulty: 3
  prereqs:
  - co5-tls-termination
  eli5: TLS failures can happen before application data is exchanged. Diagnose them by checking the client name,
    certificate chain, validity dates, negotiated protocol and ALPN result.
  key_points:
  - Capture the exact hostname used by the client and compare it with certificate names.
  - Inspect certificate chain completeness and trust anchors.
  - Check system time because validity checks depend on accurate clocks.
  - Review TLS version and cipher compatibility without weakening validation unnecessarily.
  - Verify that the terminated connection and upstream connection have the intended security properties.
  deep_dive: 'Diagnosing TLS Certificate and Interoperability Failures belongs to Rate Limiting and TLS Security
    in CO-5, which focuses on evaluating and operating the network that has already been built. The aim is to turn
    an operational symptom into a defensible conclusion supported by repeatable evidence. Start by defining the
