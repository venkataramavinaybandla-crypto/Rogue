    Document the hypothesis, test, evidence, change and outcome so another engineer can reproduce the reasoning.
    This disciplined process reduces guesswork and makes network operations safer, faster and easier to audit.'
  formulas:
  - id: co5-tls-failure-diagnosis-formula
    latex: Handshake_success = certificate_ok AND negotiation_ok
    vars: 'certificate_ok: peer identity validation; negotiation_ok: compatible TLS negotiation'
    example: A valid certificate does not guarantee a successful handshake if client and server cannot agree on
      supported TLS parameters.
