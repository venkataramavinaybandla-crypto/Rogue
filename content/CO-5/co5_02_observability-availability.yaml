- id: co5-availability-arithmetic
  code: CN-CO5.02.3
  title: Availability Chains and Availability Arithmetic
  session: 18
  skilling_exp: 21
  btl: 4
  difficulty: 3
  prereqs:
  - co5-observability-cardinality
  eli5: Availability estimates how often a service is usable. When a service depends on several required components
    in series, every component must work for the whole path to work.
  key_points:
  - Availability is commonly expressed as a fraction or percentage of time service is usable.
  - For independent serial dependencies, end-to-end availability is the product of component availabilities.
  - Redundant parallel components can improve availability when failures are sufficiently independent.
  - A dependency map is needed before calculating a service availability chain.
  - A percentage should be paired with a time window and a clear definition of service success.
  deep_dive: 'Availability Chains and Availability Arithmetic belongs to Observability and Availability in CO-5,
    which focuses on evaluating and operating the network that has already been built. The aim is to turn an operational
    symptom into a defensible conclusion supported by repeatable evidence. Start by defining the service behaviour
    that is failing, the affected scope and the time interval. State a hypothesis that predicts an observable result,
    then select a test that can distinguish it from competing explanations. Collect evidence from relevant endpoints
    and intermediate systems, including counters, logs, traces, packet observations and configuration state. The
    formula included with this concept is a compact model: identify every variable, preserve units, state assumptions
    and explain the limits of the result. The visualization is a learning aid rather than a complete implementation
    of a vendor device or production control plane. For a real change, estimate the blast radius, make one controlled
    adjustment, retain a rollback path and repeat the original test. Verification should demonstrate service restoration
    and check for regressions, not merely confirm that a command returned successfully. Document the hypothesis,
    test, evidence, change and outcome so another engineer can reproduce the reasoning. This disciplined process
    reduces guesswork and makes network operations safer, faster and easier to audit.'
  formulas:
  - id: co5-availability-arithmetic-formula
    latex: A_series = product(A_i)
    vars: 'A_series: end-to-end serial availability; A_i: availability of each required component'
    example: Three independent required components at 99%, 99.5% and 99.9% yield approximately 98.405% end-to-end
      availability.
  viz:
    type: bar_compare
    description: Explore the operational relationship behind availability chains and availability arithmetic using
      controlled input values; compare the simplified result with measured system behaviour.
    params:
    - name: input_a
      label: Input A
      min: 1
      max: 100
      step: 1
      default: 20
      unit: units
    - name: input_b
      label: Input B
      min: 1
      max: 100
      step: 1
      default: 10
      unit: units
    compute:
      difference: input_a - input_b
      ratio: input_a / input_b
    outcomes:
    - when: input_a >= input_b
      title: Input A meets or exceeds Input B
      explain: The selected values satisfy this comparison in the simplified learning model.
      severity: info
    - when: input_a < input_b
      title: Input A is below Input B
      explain: The selected values fall below the comparison threshold; investigate the underlying operational condition.
      severity: warn
    combos_to_try:
    - set:
        input_a: 20
        input_b: 10
      lesson: Establish a baseline with Input A twice Input B.
    - set:
        input_a: 8
        input_b: 16
      lesson: Reverse the relationship and explain the changed result.
  common_mistakes:
  - Adding component availability percentages.
  - Assuming failures are independent without justification.
  - Reporting availability without defining the service or measurement window.
  quiz:
  - q: What is the central purpose of Availability Chains and Availability Arithmetic?
