    radius, make one controlled adjustment, retain a rollback path and repeat the original test. Verification should
    demonstrate service restoration and check for regressions, not merely confirm that a command returned successfully.
    Document the hypothesis, test, evidence, change and outcome so another engineer can reproduce the reasoning.
    This disciplined process reduces guesswork and makes network operations safer, faster and easier to audit.'
  formulas:
  - id: co5-rollback-documentation-ai-ops-formula
    latex: Change_record = intent + scope + evidence + rollback + verification
    vars: 'intent: purpose; scope: affected systems; evidence: supporting observations; rollback: recovery plan;
      verification: post-change checks'
    example: A change record for an ACL update should identify the intended traffic, affected interfaces, prior
      rule set, rollback command and test results.
