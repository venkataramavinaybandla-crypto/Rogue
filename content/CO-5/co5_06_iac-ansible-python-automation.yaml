- id: co5-rollback-documentation-ai-ops
  code: CN-CO5.06.3
  title: Rollback, Verification, Documentation and AI in Operations
  session: 20
  skilling_exp: 22
  btl: 5
  difficulty: 3
  prereqs:
  - co5-ansible-python-automation
  eli5: Operational automation needs a safe exit plan. Documentation records what changed, while verification checks
    the real service. AI can assist analysis but its suggestions still need evidence and human review.
  key_points:
  - Every risky automated change should have a rollback or recovery strategy.
  - Verification should test service behaviour, not only configuration state.
  - Network documentation should capture topology, addressing, dependencies and ownership.
  - AI-generated diagnoses or commands must be checked against evidence and change controls.
  - A complete change record includes intent, scope, expected impact, execution, rollback and validation.
  deep_dive: 'Rollback, Verification, Documentation and AI in Operations belongs to Infrastructure as Code and Automation
    in CO-5, which focuses on evaluating and operating the network that has already been built. The aim is to turn
