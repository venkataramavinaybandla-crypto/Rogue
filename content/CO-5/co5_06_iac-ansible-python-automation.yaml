    reduces guesswork and makes network operations safer, faster and easier to audit.'
  formulas:
  - id: co5-ansible-python-automation-formula
    latex: Success_rate = successful_tasks / total_tasks
    vars: 'successful_tasks: tasks completed as expected; total_tasks: attempted tasks'
    example: If 18 of 20 tasks complete as expected, the run success rate is 90%; the two failures still require
      investigation.
  viz:
