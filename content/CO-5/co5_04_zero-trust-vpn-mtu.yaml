  - q: Which practice best supports reliable fault resolution?
    options:
    - Make several changes before measuring
    - Use a falsifiable hypothesis, controlled test and recorded evidence
    - Assume a green dashboard proves every user path works
    - Skip verification after a configuration change
    answer: 1
    why: A testable hypothesis and evidence-based workflow distinguish causes and validate the fix.
  - q: What should happen after a risky network change?
