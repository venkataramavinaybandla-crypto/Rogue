- id: co5-tunnel-overhead-diagnosis
  code: CN-CO5.04.3
  title: Tunnel Overhead and Path-MTU Diagnosis
  session: 19
  skilling_exp: 22
  btl: 4
  difficulty: 3
  prereqs:
  - co5-vpn-mtu
  eli5: When small packets work but large transfers stall, tunnel overhead and path-MTU handling are useful suspects.
    A size sweep can reveal the largest packet that passes.
  key_points:
  - Compare inner packet size with the underlay path MTU and tunnel overhead.
  - Use do-not-fragment probes where supported to find size limits.
  - Check ICMP Packet Too Big or fragmentation-needed messages along the path.
  - A black hole can occur when required MTU feedback is filtered.
  - Verify application behaviour after adjusting MTU or MSS.
  deep_dive: 'Tunnel Overhead and Path-MTU Diagnosis belongs to Zero Trust, VPN and MTU in CO-5, which focuses on
    evaluating and operating the network that has already been built. The aim is to turn an operational symptom
