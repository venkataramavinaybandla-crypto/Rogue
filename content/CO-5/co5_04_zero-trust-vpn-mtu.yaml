    latex: L_inner_max = MTU_path - H_tunnel
    vars: 'L_inner_max: maximum inner packet size in simplified model; MTU_path: path MTU; H_tunnel: overhead'
    example: A 1500-byte path with 80 bytes of tunnel overhead gives a 1420-byte simplified inner limit.
