    test, evidence, change and outcome so another engineer can reproduce the reasoning. This disciplined process
    reduces guesswork and makes network operations safer, faster and easier to audit.'
  formulas:
  - id: co5-stateful-firewalls-formula
    latex: Flow_key = (src,dst,protocol,ports)
    vars: 'src/dst: endpoint addresses; protocol: transport protocol; ports: transport ports'
    example: A TCP flow from 10.0.0.5:51000 to 203.0.113.8:443 is identified by its endpoint tuple and protocol
      for connection tracking.
  viz:
    type: state_machine
    description: Explore the operational relationship behind stateful firewalls and connection tracking using controlled
      input values; compare the simplified result with measured system behaviour.
    params:
    - name: input_a
      label: Input A
      min: 1
      max: 100
      step: 1
      default: 20
      unit: units
    - name: input_b
      label: Input B
      min: 1
      max: 100
      step: 1
      default: 10
      unit: units
    compute:
      difference: input_a - input_b
      ratio: input_a / input_b
    outcomes:
    - when: input_a >= input_b
      title: Input A meets or exceeds Input B
      explain: The selected values satisfy this comparison in the simplified learning model.
      severity: info
    - when: input_a < input_b
      title: Input A is below Input B
      explain: The selected values fall below the comparison threshold; investigate the underlying operational condition.
      severity: warn
    combos_to_try:
    - set:
        input_a: 20
        input_b: 10
