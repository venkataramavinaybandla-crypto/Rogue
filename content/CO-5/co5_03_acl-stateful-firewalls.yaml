    reduces guesswork and makes network operations safer, faster and easier to audit.'
  formulas:
  - id: co5-firewall-policy-diagnosis-formula
    latex: P_match = first matching rule index
    vars: 'P_match: position of the first matching rule in ordered policy'
    example: A packet matching rules 2 and 5 is handled by rule 2 because it is encountered first.
