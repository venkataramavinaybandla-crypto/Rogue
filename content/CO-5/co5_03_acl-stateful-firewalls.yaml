        input_b: 16
      lesson: Reverse the relationship and explain the changed result.
  common_mistakes:
  - Assuming a stateful firewall automatically fixes asymmetric routing.
  - Confusing an ACL decision with connection state.
  - Ignoring stale or exhausted connection-tracking entries.
