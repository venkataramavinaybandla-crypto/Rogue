- id: co5-firewall-policy-diagnosis
  code: CN-CO5.03.3
  title: Firewall Rule Ordering and Policy Diagnosis
  session: 18
  skilling_exp: 22
  btl: 4
  difficulty: 3
  prereqs:
  - co5-stateful-firewalls
  eli5: A firewall policy is evaluated in a defined order. Diagnosing a policy problem means finding the exact rule
    and state decision that handled the traffic.
  key_points:
  - Document rule purpose, owner, scope and expected traffic.
  - Inspect counters or logs to identify which rule matched.
  - Specific exceptions generally need to precede broader rules.
  - Test both forward and return directions where state or routing may differ.
  - Remove obsolete rules only after confirming dependencies and rollback options.
  deep_dive: 'Firewall Rule Ordering and Policy Diagnosis belongs to ACLs and Stateful Firewalls in CO-5, which
    focuses on evaluating and operating the network that has already been built. The aim is to turn an operational
