    evidence, the single change made, the expected impact and the verification result. This method matters because
    a link can remain administratively up while corruption, contention, poor signal margin, loops or airtime imbalance
    make service unusable.'
  formulas:
  - id: co4-mcs-ladder-formula
    latex: G ~= R_PHY * eta
    vars: 'G: estimated goodput; R_PHY: physical rate; eta: efficiency factor'
    example: A 600 Mbit/s PHY rate at 60% illustrative efficiency gives about 360 Mbit/s goodput.
  viz:
    type: bar_compare
    description: Explore the main variables associated with modulation and coding scheme (mcs) ladder and compare
      the simplified model with a measured network result.
