- id: co4-mcs-ladder
  code: CN-CO4.05.3
  title: Modulation and Coding Scheme (MCS) Ladder
  session: 16
  skilling_exp: 19
  btl: 4
  difficulty: 3
  prereqs:
  - co4-snr-data-rate
  eli5: An MCS is a combination of modulation and coding choices. Wireless devices move up or down an MCS ladder
    as signal conditions change.
  key_points:
  - An MCS identifies a modulation and coding combination.
  - Higher-order modulation carries more bits per symbol but needs cleaner signal conditions.
  - Coding adds redundancy for robustness but consumes capacity.
  - Rate adaptation selects a mode based on channel conditions and policy.
  - Advertised PHY rate is not application throughput.
  deep_dive: 'Modulation and Coding Scheme (MCS) Ladder is part of RF Link Budgets, SNR and MCS in CO-4, whose focus
    is to analyze link- and physical-layer behaviour and diagnose faults that may not produce an explicit error
    message. The central idea is to connect the protocol mechanism to observable network behaviour rather than memorise
    a definition. In a practical investigation, first state the expected behaviour, identify the relevant frame,
    link, signal or airtime measurement, and record a baseline before changing configuration. Then vary one factor
