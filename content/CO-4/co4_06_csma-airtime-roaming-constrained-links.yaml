    a link can remain administratively up while corruption, contention, poor signal margin, loops or airtime imbalance
    make service unusable.'
  formulas:
  - id: co4-roaming-constrained-links-formula
    latex: N_fragments = ceil(L_payload / M_payload)
    vars: 'N_fragments: fragment count; L_payload: payload length; M_payload: maximum fragment payload'
    example: A 500-byte payload with a 120-byte fragment limit requires ceil(500/120)=5 fragments.
