- id: co4-roaming-constrained-links
  code: CN-CO4.06.3
  title: Roaming and Constrained Low-Power Links
  session: 16
  skilling_exp: 20
  btl: 4
  difficulty: 3
  prereqs:
  - co4-airtime-fairness-channel-planning
  eli5: Roaming lets a wireless client move between access points. Constrained low-power links have tight limits
    on packet size, airtime, energy and duty cycle.
  key_points:
  - Roaming depends on client behaviour, signal quality, coverage and configuration.
  - Poor overlap or sticky-client behaviour can cause interruption during movement.
  - Roaming assistance depends on client and infrastructure support.
  - Constrained links may have small MTUs, low data rates, duty-cycle limits and limited energy.
  - Fragmentation, retransmissions and oversized packets are costly on constrained links.
  deep_dive: 'Roaming and Constrained Low-Power Links is part of CSMA Airtime, Roaming and Constrained Links in
    CO-4, whose focus is to analyze link- and physical-layer behaviour and diagnose faults that may not produce
    an explicit error message. The central idea is to connect the protocol mechanism to observable network behaviour
