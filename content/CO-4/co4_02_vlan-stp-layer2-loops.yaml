- id: co4-spanning-tree
  code: CN-CO4.02.3
  title: Spanning Tree and Loop-Free Topology
  session: 14
  skilling_exp: 18
  btl: 4
  difficulty: 3
  prereqs:
  - co4-layer2-loops-broadcast-storms
  eli5: Spanning tree keeps redundant switch links available as backups while selecting a loop-free set of links
    to forward traffic.
  key_points:
  - Switches exchange BPDUs to build a spanning-tree view.
  - A root bridge is selected using bridge priority and MAC address information.
  - Path costs help determine the preferred route toward the root.
  - Some redundant ports enter non-forwarding roles to prevent loops.
  - Topology changes and convergence affect recovery after link failure.
  deep_dive: 'Spanning Tree and Loop-Free Topology is part of VLANs, Trunks and Layer-2 Loop Prevention in CO-4,
    whose focus is to analyze link- and physical-layer behaviour and diagnose faults that may not produce an explicit
    error message. The central idea is to connect the protocol mechanism to observable network behaviour rather
