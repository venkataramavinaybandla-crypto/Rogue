- id: co4-physical-media-budgets
  code: CN-CO4.03.3
  title: Physical Media and Link Budgets
  session: 15
  skilling_exp: 18
  btl: 3
  difficulty: 2
  prereqs:
  - co4-lacp-link-aggregation
  eli5: A physical link has limits such as distance, attenuation, interference and hardware capability. A media
    budget checks whether enough signal margin remains.
  key_points:
  - Copper, fibre and wireless media have different reach and impairment characteristics.
  - A link budget accounts for transmit power, path loss and other losses.
  - Positive margin means received power is above the stated receiver threshold.
  - Installed media must match transceiver type, wavelength and supported distance.
  - Silent faults can arise from marginal signal, dirty connectors or incompatible optics.
  deep_dive: 'Physical Media and Link Budgets is part of Link Aggregation, LACP and Physical Media in CO-4, whose
    focus is to analyze link- and physical-layer behaviour and diagnose faults that may not produce an explicit
    error message. The central idea is to connect the protocol mechanism to observable network behaviour rather
    than memorise a definition. In a practical investigation, first state the expected behaviour, identify the relevant
