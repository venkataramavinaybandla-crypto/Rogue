    the evidence, the single change made, the expected impact and the verification result. This method matters because
    a link can remain administratively up while corruption, contention, poor signal margin, loops or airtime imbalance
    make service unusable.'
  formulas:
  - id: co4-physical-media-budgets-formula
    latex: P_rx = P_tx - L_path - L_other
    vars: 'P_rx: received dBm; P_tx: transmit dBm; L_path: path loss dB; L_other: other losses dB'
    example: With 0 dBm transmit power, 3 dB path loss and 2 dB other loss, received power is -5 dBm.
