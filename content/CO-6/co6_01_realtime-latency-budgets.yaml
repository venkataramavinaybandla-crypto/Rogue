concepts:
- id: co6-latency-components
  code: CN-CO6.01.1
  title: End-to-End Latency and Path Components
  session: 21
  skilling_exp: 23
  btl: 4
  difficulty: 2
  prereqs: []
  eli5: 'End-to-end latency is the time taken for traffic to travel from its source to its destination. It is not
    one mysterious number: it is the sum of delays introduced by the components along the path.'
  key_points:
  - Define the measurement endpoints and the event that starts and ends the timing interval.
  - Break the path into named components such as host processing, serialization, propagation, switching, queueing
    and application handling.
  - Measure each component using consistent timestamps and units.
  - Avoid double-counting overlapping intervals when adding measurements.
  - A budget is useful only when every included term has a clear measurement method.
  deep_dive: End-to-End Latency and Path Components is part of CO-6, Predictability — Real-time, Multicast and QoS.
    The purpose of this topic is to make network performance measurable and defensible for time-sensitive communication.
    Begin by defining the traffic, endpoints, path and service target. Keep delay, delay variation, loss, bandwidth
    and clock error as distinct quantities; they affect applications in different ways and should not be collapsed
    into one vague quality score. The formula in this concept is a simplified model for organizing a calculation.
    Identify every variable, retain its units and state assumptions before using it. The worked example demonstrates
    the arithmetic, but a production result must use measurements from the actual path and traffic profile. Use
    the visualization to explore how changing one input affects the simplified relationship, then compare that result
    with packet captures, counters or device measurements. For the course integration task, every component contribution
    should be named, measured and totalled. Evaluate the system under sustained contention rather than only during
    an idle period, and report p50 and p99 values against explicit targets. The result should include enough evidence
    for another engineer to reproduce the measurement and defend the conclusion.
  formulas:
  - id: co6-latency-components-formula
    latex: D_total = sum(D_i)
    vars: 'D_total: end-to-end delay; D_i: delay contribution of path component i'
    example: For component delays of 2, 4, 1 and 3 ms, the total is 10 ms.
  viz:
    type: timeline
    description: Explore end-to-end latency and path components by changing the measured value and reference, then
      interpret the result against the stated performance objective.
    params:
    - name: input_a
      label: Measured value
      min: 1
      max: 100
      step: 1
      default: 30
      unit: units
    - name: input_b
      label: Target or reference
      min: 1
      max: 100
      step: 1
      default: 40
      unit: units
    compute:
      difference: input_b - input_a
      ratio: input_a / input_b
    outcomes:
    - when: input_a <= input_b
      title: Measured value is within reference
      explain: The selected value does not exceed the reference in this simplified comparison.
      severity: info
    - when: input_a > input_b
      title: Measured value exceeds reference
      explain: The selected value exceeds the reference; inspect the relevant budget or operating condition.
      severity: warn
    combos_to_try:
    - set:
        input_a: 30
        input_b: 40
      lesson: Start with a measured value below or within the reference.
    - set:
        input_a: 75
        input_b: 40
      lesson: Increase the measured value beyond the reference and explain the operational consequence.
  common_mistakes:
  - Adding measurements from different clock domains without synchronization.
  - Leaving an unexplained residual in the total budget.
  - Mixing one-way and round-trip delay measurements.
  quiz:
  - q: What is the main engineering concern in end-to-end latency and path components?
    options:
    - Measure and manage the performance behaviour described by end-to-end latency and path components
    - Assume every packet has identical delay
    - Replace all network protocols with one mechanism
    - Optimize only the peak throughput
    answer: 0
    why: The topic focuses on making the named performance behaviour measurable and controllable.
  - q: Why should performance be evaluated under sustained contention?
    options:
    - It removes the need for measurement
    - It reveals queueing and tail behaviour that may not appear on an idle path
    - It guarantees every packet will be delayed equally
    - It makes clock synchronization unnecessary
    answer: 1
    why: Load exposes resource contention and tail effects that quiet-period tests can hide.
  - q: Which evidence makes a performance claim defensible?
    options:
    - A single best-case ping
    - A screenshot of a dashboard without context
    - Named path components, a documented method, measured results and stated targets
    - An estimate based only on the configured link speed
    answer: 2
    why: A reproducible claim requires explicit measurements, method and acceptance criteria.
  exam_tags:
  - mid-term
  - end-sem
  - skill-exam
  - project
  mini_task: Build a small measurement or calculation exercise for end-to-end latency and path components. State
    the traffic conditions and target, record the result, and explain whether the result meets the target.
- id: co6-latency-budget
  code: CN-CO6.01.2
  title: Latency Budget Allocation and Verification
  session: 21
  skilling_exp: 23
  btl: 4
  difficulty: 3
  prereqs:
  - co6-latency-components
  eli5: A latency budget divides the allowed end-to-end delay among the parts of a communication path. Each part
    receives a target, and measurements show whether the path stays within the total limit.
  key_points:
  - Start with an explicit end-to-end latency target.
  - Allocate a budget to every path component and document the reason for each allocation.
  - Include processing, network, buffering and media endpoint contributions where applicable.
  - Compare measured values with allocated budgets rather than relying on averages alone.
  - Revisit allocations when topology, traffic load or endpoint behaviour changes.
  deep_dive: Latency Budget Allocation and Verification is part of CO-6, Predictability — Real-time, Multicast and
    QoS. The purpose of this topic is to make network performance measurable and defensible for time-sensitive communication.
    Begin by defining the traffic, endpoints, path and service target. Keep delay, delay variation, loss, bandwidth
    and clock error as distinct quantities; they affect applications in different ways and should not be collapsed
    into one vague quality score. The formula in this concept is a simplified model for organizing a calculation.
    Identify every variable, retain its units and state assumptions before using it. The worked example demonstrates
    the arithmetic, but a production result must use measurements from the actual path and traffic profile. Use
    the visualization to explore how changing one input affects the simplified relationship, then compare that result
    with packet captures, counters or device measurements. For the course integration task, every component contribution
    should be named, measured and totalled. Evaluate the system under sustained contention rather than only during
    an idle period, and report p50 and p99 values against explicit targets. The result should include enough evidence
    for another engineer to reproduce the measurement and defend the conclusion.
  formulas:
  - id: co6-latency-budget-formula
    latex: D_remaining = D_target - sum(D_measured)
    vars: 'D_remaining: unallocated budget; D_target: total target; D_measured: measured component delays'
    example: A 50 ms target with measured contributions totalling 37 ms leaves 13 ms unallocated.
  viz:
    type: bar_compare
    description: Explore latency budget allocation and verification by changing the measured value and reference,
      then interpret the result against the stated performance objective.
    params:
    - name: input_a
      label: Measured value
      min: 1
      max: 100
      step: 1
      default: 30
      unit: units
    - name: input_b
      label: Target or reference
      min: 1
      max: 100
      step: 1
      default: 40
      unit: units
    compute:
      difference: input_b - input_a
      ratio: input_a / input_b
    outcomes:
    - when: input_a <= input_b
      title: Measured value is within reference
      explain: The selected value does not exceed the reference in this simplified comparison.
      severity: info
    - when: input_a > input_b
      title: Measured value exceeds reference
      explain: The selected value exceeds the reference; inspect the relevant budget or operating condition.
      severity: warn
    combos_to_try:
    - set:
        input_a: 30
        input_b: 40
      lesson: Start with a measured value below or within the reference.
    - set:
        input_a: 75
        input_b: 40
      lesson: Increase the measured value beyond the reference and explain the operational consequence.
  common_mistakes:
  - Allocating the entire target without any margin.
  - Ignoring endpoint and playout contributions.
  - Declaring success from a single quiet-period measurement.
  quiz:
  - q: What is the main engineering concern in latency budget allocation and verification?
    options:
    - Measure and manage the performance behaviour described by latency budget allocation and verification
    - Assume every packet has identical delay
    - Replace all network protocols with one mechanism
    - Optimize only the peak throughput
    answer: 0
    why: The topic focuses on making the named performance behaviour measurable and controllable.
  - q: Why should performance be evaluated under sustained contention?
    options:
    - It removes the need for measurement
    - It reveals queueing and tail behaviour that may not appear on an idle path
    - It guarantees every packet will be delayed equally
    - It makes clock synchronization unnecessary
    answer: 1
    why: Load exposes resource contention and tail effects that quiet-period tests can hide.
  - q: Which evidence makes a performance claim defensible?
    options:
    - A single best-case ping
    - A screenshot of a dashboard without context
    - Named path components, a documented method, measured results and stated targets
    - An estimate based only on the configured link speed
    answer: 2
    why: A reproducible claim requires explicit measurements, method and acceptance criteria.
