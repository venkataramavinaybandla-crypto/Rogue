    only during an idle period, and report p50 and p99 values against explicit targets. The result should include
    enough evidence for another engineer to reproduce the measurement and defend the conclusion.
  formulas:
  - id: co6-realtime-traffic-formula
    latex: T_packet = payload_bits / media_rate
    vars: 'T_packet: packetization interval; payload_bits: bits accumulated; media_rate: bit rate'
    example: At 64 kbit/s, accumulating 160 bits takes 2.5 ms; real packetization choices include additional framing
      and codec considerations.
  viz:
    type: packet_flow
    description: Explore time-sensitive traffic and real-time communication by changing the measured value and reference,
      then interpret the result against the stated performance objective.
