- id: co6-realtime-traffic
  code: CN-CO6.01.3
  title: Time-Sensitive Traffic and Real-Time Communication
  session: 21
  skilling_exp: 23
  btl: 3
  difficulty: 2
  prereqs:
  - co6-latency-budget
  eli5: Real-time communication depends on information arriving while it is still useful. A late voice or media
    packet may be less valuable than a lost packet because playback cannot always wait for retransmission.
  key_points:
  - Identify the application deadline and the consequence of missing it.
  - Distinguish throughput requirements from delay and jitter requirements.
  - Account for packetization, network transit and receiver buffering.
  - Use measurements that represent actual communication under realistic load.
  - State the latency and media-quality targets before tuning the network.
  deep_dive: Time-Sensitive Traffic and Real-Time Communication is part of CO-6, Predictability — Real-time, Multicast
    and QoS. The purpose of this topic is to make network performance measurable and defensible for time-sensitive
    communication. Begin by defining the traffic, endpoints, path and service target. Keep delay, delay variation,
    loss, bandwidth and clock error as distinct quantities; they affect applications in different ways and should
    not be collapsed into one vague quality score. The formula in this concept is a simplified model for organizing
    a calculation. Identify every variable, retain its units and state assumptions before using it. The worked example
    demonstrates the arithmetic, but a production result must use measurements from the actual path and traffic
    profile. Use the visualization to explore how changing one input affects the simplified relationship, then compare
