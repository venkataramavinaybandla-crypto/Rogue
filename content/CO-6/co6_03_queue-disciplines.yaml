- id: co6-fair-queuing
  code: CN-CO6.03.3
  title: Fair Queuing and Service Sharing
  session: 22
  skilling_exp: 24
  btl: 4
  difficulty: 3
  prereqs:
  - co6-fifo-queues
  eli5: Fair queuing shares link service among flows so that one busy flow cannot automatically consume all available
    capacity. The exact fairness depends on the scheduler and its weights.
  key_points:
  - Fair queuing separates traffic into flows or classes for scheduling.
  - Service can be shared approximately equally or according to configured weights.
  - A busy flow should not monopolize the entire output link.
  - Flow identification and scheduler configuration affect the result.
  - Evaluate per-flow throughput and latency under competing traffic.
  deep_dive: Fair Queuing and Service Sharing is part of CO-6, Predictability — Real-time, Multicast and QoS. The
    purpose of this topic is to make network performance measurable and defensible for time-sensitive communication.
    Begin by defining the traffic, endpoints, path and service target. Keep delay, delay variation, loss, bandwidth
    and clock error as distinct quantities; they affect applications in different ways and should not be collapsed
    into one vague quality score. The formula in this concept is a simplified model for organizing a calculation.
    Identify every variable, retain its units and state assumptions before using it. The worked example demonstrates
    the arithmetic, but a production result must use measurements from the actual path and traffic profile. Use
    the visualization to explore how changing one input affects the simplified relationship, then compare that result
    with packet captures, counters or device measurements. For the course integration task, every component contribution
    should be named, measured and totalled. Evaluate the system under sustained contention rather than only during
    an idle period, and report p50 and p99 values against explicit targets. The result should include enough evidence
    for another engineer to reproduce the measurement and defend the conclusion.
  formulas:
  - id: co6-fair-queuing-formula
    latex: R_i = w_i/sum(w) * R
    vars: 'R_i: idealized share for flow i; w_i: its weight; R: link service rate'
    example: With weights 1 and 3 on a 20 Mbit/s link, idealized shares are 5 and 15 Mbit/s when both flows are
      backlogged.
  viz:
    type: bar_compare
    description: Explore fair queuing and service sharing by changing the measured value and reference, then interpret
      the result against the stated performance objective.
    params:
