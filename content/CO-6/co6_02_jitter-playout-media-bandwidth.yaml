concepts:
- id: co6-jitter-distributions
  code: CN-CO6.02.1
  title: Jitter and Delay Variation
  session: 21
  skilling_exp: 23
  btl: 4
  difficulty: 2
  prereqs:
  - co6-latency-components
  eli5: Jitter describes variation in packet arrival timing. Two paths can have the same average delay but feel
    very different to a real-time application if one path has much larger delay swings.
  key_points:
  - Measure packet arrival times against a consistent reference.
  - Distinguish absolute delay from variation between packet delays.
  - Report a distribution rather than only one average value.
  - Inspect tail behaviour because occasional large delays can disrupt playback.
  - Relate jitter measurements to the receiver's playout strategy.
  deep_dive: Jitter and Delay Variation is part of CO-6, Predictability — Real-time, Multicast and QoS. The purpose
    of this topic is to make network performance measurable and defensible for time-sensitive communication. Begin
    by defining the traffic, endpoints, path and service target. Keep delay, delay variation, loss, bandwidth and
    clock error as distinct quantities; they affect applications in different ways and should not be collapsed into
    one vague quality score. The formula in this concept is a simplified model for organizing a calculation. Identify
    every variable, retain its units and state assumptions before using it. The worked example demonstrates the
    arithmetic, but a production result must use measurements from the actual path and traffic profile. Use the
    visualization to explore how changing one input affects the simplified relationship, then compare that result
    with packet captures, counters or device measurements. For the course integration task, every component contribution
    should be named, measured and totalled. Evaluate the system under sustained contention rather than only during
    an idle period, and report p50 and p99 values against explicit targets. The result should include enough evidence
    for another engineer to reproduce the measurement and defend the conclusion.
  formulas:
  - id: co6-jitter-distributions-formula
    latex: J_i = D_i - D_(i-1)
    vars: 'J_i: delay variation between consecutive packets; D_i: one-way delay of packet i'
    example: If consecutive packet delays are 18 ms and 25 ms, the delay variation is +7 ms.
  viz:
    type: timeline
    description: Explore jitter and delay variation by changing the measured value and reference, then interpret
      the result against the stated performance objective.
    params:
    - name: input_a
      label: Measured value
      min: 1
      max: 100
      step: 1
      default: 30
      unit: units
    - name: input_b
      label: Target or reference
      min: 1
      max: 100
      step: 1
      default: 40
      unit: units
    compute:
      difference: input_b - input_a
      ratio: input_a / input_b
    outcomes:
    - when: input_a <= input_b
      title: Measured value is within reference
      explain: The selected value does not exceed the reference in this simplified comparison.
      severity: info
    - when: input_a > input_b
      title: Measured value exceeds reference
      explain: The selected value exceeds the reference; inspect the relevant budget or operating condition.
      severity: warn
    combos_to_try:
    - set:
        input_a: 30
        input_b: 40
      lesson: Start with a measured value below or within the reference.
    - set:
        input_a: 75
        input_b: 40
      lesson: Increase the measured value beyond the reference and explain the operational consequence.
  common_mistakes:
  - Calling average latency jitter.
  - Ignoring packet reordering and loss when interpreting arrival gaps.
  - Reporting only the minimum and average delay.
  quiz:
  - q: What is the main engineering concern in jitter and delay variation?
    options:
    - Measure and manage the performance behaviour described by jitter and delay variation
    - Assume every packet has identical delay
    - Replace all network protocols with one mechanism
    - Optimize only the peak throughput
    answer: 0
    why: The topic focuses on making the named performance behaviour measurable and controllable.
  - q: Why should performance be evaluated under sustained contention?
    options:
    - It removes the need for measurement
    - It reveals queueing and tail behaviour that may not appear on an idle path
    - It guarantees every packet will be delayed equally
    - It makes clock synchronization unnecessary
    answer: 1
    why: Load exposes resource contention and tail effects that quiet-period tests can hide.
  - q: Which evidence makes a performance claim defensible?
    options:
    - A single best-case ping
    - A screenshot of a dashboard without context
    - Named path components, a documented method, measured results and stated targets
    - An estimate based only on the configured link speed
    answer: 2
    why: A reproducible claim requires explicit measurements, method and acceptance criteria.
  exam_tags:
  - mid-term
  - end-sem
  - skill-exam
  - project
  mini_task: Build a small measurement or calculation exercise for jitter and delay variation. State the traffic
    conditions and target, record the result, and explain whether the result meets the target.
- id: co6-playout-buffer
  code: CN-CO6.02.2
  title: Tail-Sized Playout Buffers
  session: 21
  skilling_exp: 23
  btl: 4
  difficulty: 3
  prereqs:
  - co6-jitter-distributions
  eli5: A playout buffer holds arriving media briefly so packets can be played at a steady time. A larger buffer
    can absorb more delay variation, but it also adds latency.
  key_points:
  - Choose a buffer target using the observed delay distribution and application tolerance.
  - A tail percentile can protect against uncommon but disruptive delay spikes.
  - Increasing buffer depth trades lower late-arrival risk for greater playback delay.
  - Measure late and discarded packets as well as buffer occupancy.
  - Re-evaluate buffer settings under sustained contention and changing path conditions.
  deep_dive: Tail-Sized Playout Buffers is part of CO-6, Predictability — Real-time, Multicast and QoS. The purpose
    of this topic is to make network performance measurable and defensible for time-sensitive communication. Begin
    by defining the traffic, endpoints, path and service target. Keep delay, delay variation, loss, bandwidth and
    clock error as distinct quantities; they affect applications in different ways and should not be collapsed into
    one vague quality score. The formula in this concept is a simplified model for organizing a calculation. Identify
    every variable, retain its units and state assumptions before using it. The worked example demonstrates the
    arithmetic, but a production result must use measurements from the actual path and traffic profile. Use the
    visualization to explore how changing one input affects the simplified relationship, then compare that result
    with packet captures, counters or device measurements. For the course integration task, every component contribution
    should be named, measured and totalled. Evaluate the system under sustained contention rather than only during
    an idle period, and report p50 and p99 values against explicit targets. The result should include enough evidence
    for another engineer to reproduce the measurement and defend the conclusion.
  formulas:
  - id: co6-playout-buffer-formula
    latex: B_required ≈ D_tail - D_playout_base
    vars: 'B_required: additional buffer; D_tail: selected tail delay; D_playout_base: baseline playout allowance'
    example: If the chosen tail delay is 42 ms and the baseline allowance is 25 ms, the additional buffer estimate
      is 17 ms.
  viz:
    type: queue_curve
    description: Explore tail-sized playout buffers by changing the measured value and reference, then interpret
      the result against the stated performance objective.
    params:
    - name: input_a
      label: Measured value
      min: 1
      max: 100
      step: 1
      default: 30
      unit: units
    - name: input_b
      label: Target or reference
      min: 1
      max: 100
      step: 1
      default: 40
      unit: units
    compute:
      difference: input_b - input_a
      ratio: input_a / input_b
    outcomes:
    - when: input_a <= input_b
      title: Measured value is within reference
      explain: The selected value does not exceed the reference in this simplified comparison.
      severity: info
    - when: input_a > input_b
      title: Measured value exceeds reference
      explain: The selected value exceeds the reference; inspect the relevant budget or operating condition.
      severity: warn
    combos_to_try:
    - set:
        input_a: 30
        input_b: 40
      lesson: Start with a measured value below or within the reference.
    - set:
        input_a: 75
        input_b: 40
      lesson: Increase the measured value beyond the reference and explain the operational consequence.
  common_mistakes:
  - Sizing a buffer from the mean delay only.
  - Increasing the buffer without checking interactive latency.
  - Assuming a fixed buffer handles every traffic condition.
  quiz:
  - q: What is the main engineering concern in tail-sized playout buffers?
    options:
    - Measure and manage the performance behaviour described by tail-sized playout buffers
    - Assume every packet has identical delay
    - Replace all network protocols with one mechanism
    - Optimize only the peak throughput
    answer: 0
    why: The topic focuses on making the named performance behaviour measurable and controllable.
  - q: Why should performance be evaluated under sustained contention?
    options:
    - It removes the need for measurement
    - It reveals queueing and tail behaviour that may not appear on an idle path
