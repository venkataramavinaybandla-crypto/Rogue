  mini_task: Build a small measurement or calculation exercise for policing versus shaping. State the traffic conditions
    and target, record the result, and explain whether the result meets the target.
- id: co6-media-wire-rate
  code: CN-CO6.04.3
  title: Media Wire-Rate and QoS Capacity Planning
  session: 22
  skilling_exp: 24
  btl: 4
  difficulty: 2
  prereqs:
  - co6-media-bandwidth
  - co6-policing-shaping
  eli5: QoS planning must compare the actual wire rate of media traffic with the capacity available to its class.
    Header overhead, packet rate and concurrent streams all affect the result.
  key_points:
  - Calculate per-stream wire rate including packet overhead.
  - Multiply by the expected number of simultaneous streams.
  - Account for other traffic assigned to the same class.
  - Leave operating headroom for bursts and measurement uncertainty.
  - Check the configured scheduler and policer against the calculated requirement.
  deep_dive: Media Wire-Rate and QoS Capacity Planning is part of CO-6, Predictability — Real-time, Multicast and
    QoS. The purpose of this topic is to make network performance measurable and defensible for time-sensitive communication.
    Begin by defining the traffic, endpoints, path and service target. Keep delay, delay variation, loss, bandwidth
    and clock error as distinct quantities; they affect applications in different ways and should not be collapsed
    into one vague quality score. The formula in this concept is a simplified model for organizing a calculation.
    Identify every variable, retain its units and state assumptions before using it. The worked example demonstrates
    the arithmetic, but a production result must use measurements from the actual path and traffic profile. Use
    the visualization to explore how changing one input affects the simplified relationship, then compare that result
    with packet captures, counters or device measurements. For the course integration task, every component contribution
    should be named, measured and totalled. Evaluate the system under sustained contention rather than only during
    an idle period, and report p50 and p99 values against explicit targets. The result should include enough evidence
    for another engineer to reproduce the measurement and defend the conclusion.
  formulas:
  - id: co6-media-wire-rate-formula
    latex: R_total = n * R_wire
    vars: 'R_total: aggregate media wire rate; n: simultaneous streams; R_wire: per-stream wire rate'
    example: If each stream uses 96 kbit/s on the wire and 40 streams are active, aggregate demand is 3.84 Mbit/s.
  viz:
    type: bar_compare
    description: Explore media wire-rate and qos capacity planning by changing the measured value and reference,
      then interpret the result against the stated performance objective.
